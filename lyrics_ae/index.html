<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lyrics AE</title>
  <style>
    :root {
      --btn-bg: #555555;
      --btn-fg: #f0f0f0;
      --btn-border: #666666;
      --btn-hover: #666666;
      --label-fg: #888888;
      --status-fg: #888888;
    }
    body {
      font-family: "Segoe UI", sans-serif;
      font-size: 13px;
      background: #323232;
      color: #cccccc;
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
    }
    .section-label {
      font-size: 11px;
      color: var(--label-fg);
      margin-bottom: 4px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      cursor: pointer;
    }
    input[type="radio"] {
      margin-right: 6px;
    }
    .btn-row {
      display: flex;
      gap: 6px;
    }
    button {
      padding: 6px 12px;
      background: var(--btn-bg);
      color: var(--btn-fg);
      border: 1px solid var(--btn-border);
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
    }
    button:hover:not(:disabled) {
      background: var(--btn-hover);
    }
    button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    #json-loaded {
      margin-top: 6px;
      font-size: 12px;
      color: var(--label-fg);
    }
    #btn-place {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 8px 12px;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: var(--status-fg);
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div id="controls">
    <div class="section-label">データ読込</div>
    <div class="btn-row">
      <button id="btn-open-mapper">Lyrics Mapperを起動</button>
      <button id="btn-select-json">JSONを選択...</button>
    </div>
    <input type="file" id="json-input" accept=".json" style="display:none">
    <div id="json-loaded">データが読み込まれていません</div>

    <div class="section-label" style="margin-top:16px">配置モード</div>
    <div>
      <label>
        <input type="radio" name="lyricsMode" value="layers" checked>
        テキストレイヤを追加
      </label>
      <label>
        <input type="radio" name="lyricsMode" value="keyframes">
        1レイヤ＋キーフレーム
      </label>
    </div>

    <button id="btn-place" disabled>テキスト配置</button>
    <div id="status"></div>
  </div>

  <script src="js/CSInterface.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
