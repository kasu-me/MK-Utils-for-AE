<!doctype html>
<html>

<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="css/style.css">
	<title>PSD Tool AE</title>
</head>

<body>
	<div id="controls">
		<button id="btn-reload">再読み込み</button>
		<button id="btn-collapse-all" style="margin-top: 5px; font-size: 0.9em;">すべてのフォルダを畳む</button>
		<label class="silence-check"><input type="checkbox" id="chk-thumbnails">レイヤーのサムネイルを表示</label>
		<div id="status-thumb"></div>

		<!-- Keyframe Operation Controls -->
		<div class="keyframe-section" style="margin-top: 10px;">
			<div class="section-label" style="font-weight:600; margin-bottom:6px;">キーフレーム操作</div>
			<div style="display: flex; gap: 5px; align-items: center;">
				<button id="btn-get-keys" style="flex: 1;">取得</button>
				<button id="btn-move-keys" style="flex: 1;">移動</button>
				<button id="btn-delete-keys" style="flex: 1;color: #ff6666;" title="現在の時間のキーフレームを全階層から削除&#10;Shift+クリック: 現在の時間以降すべて&#10;Ctrl+クリック: 選択レイヤー（プリコンポの中身を含む）のみ&#10;Ctrl+Shift+クリック: 選択レイヤーの現在の時間以降すべて">削除</button>
			</div>
			<div id="status-keyframe" style="margin-top: 5px; color: #888; font-size: 0.9em; min-height: 1.2em;"></div>
		</div>

		<!-- LipSync Controls -->
		<div class="lipsync-section" style="margin-top: 10px;">
			<div class="section-label" style="font-weight:600; margin-bottom:6px;">口パク</div>
			<div style="display: flex; gap: 5px; align-items: center;">
				<button id="btn-lipsync-settings" style="flex: 1;">口パク設定</button>
				<button id="btn-lipsync-generate" style="flex: 2;" title="選択した音声レイヤーと同名のlabファイルから口パクを生成">選択音声から口パク生成</button>
			</div>
			<div id="status-lipsync"></div>
		</div>

		<!-- Silence Cut Controls -->
		<div class="silence-section" style="margin-top: 10px;">
			<div class="section-label" style="font-weight:600; margin-bottom:6px;">無音カット</div>
			<div style="display: flex; gap: 5px; align-items: center;">
				<button id="btn-silence-settings" style="flex: 1;">無音カット設定</button>
				<button id="btn-silence-cut" style="flex: 2;" title="選択した音声レイヤー(WAV)の無音部分に合わせてイン/アウトを切り詰める&#10;元のファイルは変更しません">選択音声の無音カット</button>
			</div>
			<div id="status-silence"></div>
		</div>
	</div>

	<div id="main-area">
		<div id="tree-section">
			<div id="tree-container">
				<!-- Tree will be rendered here -->
				<p style="text-align:center; color:#888;">コンポジションを読み込んでください</p>
			</div>
		</div>
		<div id="preset-section">
			<div class="preset-header">
				<span>Presets</span>
				<div style="display:flex;">
					<button id="btn-import-preset" title="Import"
						style="width:auto; padding:2px 6px; margin-right:2px;">In</button>
					<button id="btn-export-preset" title="Export"
						style="width:auto; padding:2px 6px; margin-right:2px;">Ex</button>
					<button id="btn-add-preset" title="Add" style="width:auto; padding:2px 8px;">+</button>
				</div>
			</div>
			<div id="preset-list">
				<!-- Presets will be rendered here -->
			</div>
			<button id="btn-manage-storage"
				style="margin-top: 10px; width: 100%; font-size: 0.8em; opacity: 0.7;">プリセット整理</button>
		</div>

		<!-- Storage Management Modal -->
		<div id="storage-modal" class="modal">
			<div class="modal-content">
				<div class="modal-header">
					<h3>保存済みプリセット管理</h3>
					<span class="close-modal">&times;</span>
				</div>
				<div id="storage-list-container">
					<!-- List items will be injected here -->
				</div>
			</div>
		</div>

		<!-- LipSync Settings Modal -->
		<div id="lipsync-modal" class="modal">
			<div class="modal-content">
				<div class="modal-header">
					<h3>口パク設定</h3>
					<span class="close-modal" id="lipsync-modal-close">&times;</span>
				</div>
				<div id="lipsync-modal-body">
					<div class="lipsync-group-label">共通設定</div>
					<div class="lipsync-field">
						<label for="lipsync-regex">話者名の抽出正規表現</label>
						<input type="text" id="lipsync-regex">
					</div>
					<div class="lipsync-field-row">
						<div class="lipsync-field">
							<label for="lipsync-lead">先行フレーム数</label>
							<input type="number" id="lipsync-lead" min="0" max="10">
						</div>
						<div class="lipsync-field">
							<label for="lipsync-min">最短表示フレーム数</label>
							<input type="number" id="lipsync-min" min="1" max="10">
						</div>
					</div>

					<div class="lipsync-group-label">キャラクター</div>
					<div id="lipsync-config-list"></div>
					<div class="lipsync-add-row">
						<select id="lipsync-candidate"></select>
						<button id="btn-lipsync-add">追加</button>
					</div>
				</div>
			</div>
		</div>

		<!-- Silence Cut Settings Modal -->
		<div id="silence-modal" class="modal">
			<div class="modal-content">
				<div class="modal-header">
					<h3>無音カット設定</h3>
					<span class="close-modal" id="silence-modal-close">&times;</span>
				</div>
				<div id="silence-modal-body">
					<div class="lipsync-group-label">判定</div>
					<div class="lipsync-field-row">
						<div class="lipsync-field">
							<label for="silence-threshold">無音とみなす音量 (dB)</label>
							<input type="number" id="silence-threshold" min="-90" max="0" step="1">
						</div>
						<div class="lipsync-field">
							<label for="silence-padding">前後に残す余白 (ms)</label>
							<input type="number" id="silence-padding" min="0" max="2000" step="10">
						</div>
					</div>

					<div class="lipsync-group-label">途中の無音</div>
					<label class="silence-check"><input type="checkbox" id="silence-split">途中の無音でレイヤーを分割する</label>
					<div class="lipsync-field">
						<label for="silence-min-gap">分割する無音の最短の長さ (ms)</label>
						<input type="number" id="silence-min-gap" min="50" max="10000" step="50">
					</div>

					<div class="lipsync-group-label">配置</div>
					<label class="silence-check"><input type="checkbox" id="silence-ripple">カットした隙間を詰める (選択した音声レイヤーのみ移動)</label>

					<p class="silence-note">元のWAVファイルは変更せず、レイヤーのイン/アウトだけを切り詰めます。口パク・字幕の生成より前に実行してください。</p>
				</div>
			</div>
		</div>

		<div id="thumb-preview"><canvas></canvas></div>

		<script src="js/CSInterface.js"></script>
		<script src="js/psdthumb.js"></script>
		<script src="js/main.js"></script>
</body>

</html>
