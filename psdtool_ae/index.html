<!doctype html>
<html>

<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="css/style.css">
	<title>PSD Tool AE</title>
</head>

<body>
	<div id="controls">
		<div class="action-row">
			<div class="action-label">キーフレーム</div>
			<div class="action-buttons">
				<button id="btn-get-keys" title="現在の時間のキーフレームを全階層から記録&#10;Shift+クリック: 現在の時間以降すべて">取得</button>
				<button id="btn-move-keys" title="記録したキーフレームを現在の時間へ移動">移動</button>
				<button id="btn-delete-keys" title="現在の時間のキーフレームを全階層から削除&#10;Shift+クリック: 現在の時間以降すべて&#10;Ctrl+クリック: 選択レイヤー（プリコンポの中身を含む）のみ&#10;Ctrl+Shift+クリック: 選択レイヤーの現在の時間以降すべて">削除</button>
				<button id="btn-settings" title="字幕・口パク、無音カット、レイヤー一覧の設定">⚙ 設定</button>
			</div>
		</div>

		<!-- 左から作業順 (無音カットは字幕・口パクの生成より前に行う) -->
		<div class="action-row">
			<div class="action-label" title="タイムラインで選択した音声レイヤーが対象です">選択音声</div>
			<div class="action-buttons">
				<button id="btn-silence-cut" title="選択した音声レイヤー(WAV)の無音部分に合わせてイン/アウトを切り詰める&#10;元のファイルは変更しません&#10;字幕・口パクの生成より前に実行してください">無音カット</button>
				<button id="btn-subtitle-apply" title="選択した音声レイヤーと同名のtxtファイルの内容を字幕として反映">字幕反映</button>
				<button id="btn-lipsync-generate" title="選択した音声レイヤーと同名のlabファイルから口パクを生成">口パク生成</button>
				<button id="btn-batch-generate" class="btn-primary" title="選択した音声レイヤーから字幕と口パクをまとめて生成&#10;Ctrl+Zで両方まとめて取り消せます">字幕・口パク一括</button>
			</div>
		</div>

		<div class="action-row">
			<div class="action-label" title="タイムラインで選択したテキストレイヤーが対象です">選択テキスト</div>
			<div class="action-buttons">
				<button id="btn-budoux" title="選択したテキストレイヤーをBudouXで自然な位置に改行&#10;Source Textのキーフレームを選択している場合は、そのキーフレームのみ">BudouX改行</button>
			</div>
		</div>

		<!-- 直近の操作の結果を表示する -->
		<div id="status-area">
			<div id="status-main"></div>
			<div id="status-sub"></div>
		</div>
	</div>

	<div id="main-area">
		<div id="tree-section">
			<div class="pane-header">
				<span id="tree-title" class="pane-title">レイヤー一覧</span>
				<div class="pane-header-buttons">
					<button id="btn-reload" title="アクティブなコンポジションを読み込み直す">再読み込み</button>
					<button id="btn-collapse-all">すべてのフォルダを畳む</button>
				</div>
			</div>
			<div id="status-thumb"></div>
			<div id="tree-container">
				<!-- Tree will be rendered here -->
				<p class="tree-message">コンポジションを読み込んでください</p>
			</div>
		</div>
		<div id="preset-section">
			<div class="pane-header">
				<span class="pane-title">プリセット</span>
				<div class="pane-header-buttons">
					<button id="btn-add-preset" title="現在の表示状態をプリセットとして保存">＋ 追加</button>
				</div>
			</div>
			<div id="preset-list">
				<!-- Presets will be rendered here -->
			</div>
			<div id="preset-footer">
				<button id="btn-import-preset" title="JSONファイルからプリセットを読み込む">読込</button>
				<button id="btn-export-preset" title="このコンポジションのプリセットをJSONファイルに書き出す">書出</button>
				<button id="btn-manage-storage" title="保存済みのプリセットを一覧・削除する">整理</button>
			</div>
		</div>
	</div>

	<!-- Storage Management Modal -->
	<div id="storage-modal" class="modal">
		<div class="modal-content">
			<div class="modal-header">
				<h3>保存済みプリセット管理</h3>
				<span class="close-modal">&times;</span>
			</div>
			<div id="storage-list-container">
				<!-- List items will be injected here -->
			</div>
		</div>
	</div>

	<!-- Settings Modal -->
	<div id="settings-modal" class="modal">
		<div class="modal-content">
			<div class="modal-header">
				<h3>設定</h3>
				<span class="close-modal" id="settings-modal-close">&times;</span>
			</div>
			<div class="settings-tabs">
				<button class="settings-tab active" data-pane="settings-pane-lipsync">字幕・口パク</button>
				<button class="settings-tab" data-pane="settings-pane-silence">無音カット</button>
				<button class="settings-tab" data-pane="settings-pane-view">レイヤー一覧</button>
			</div>
			<div id="settings-body">
				<div id="settings-pane-lipsync" class="settings-pane active">
					<div class="lipsync-group-label">共通設定</div>
					<div class="lipsync-field">
						<label for="lipsync-regex">話者名の抽出正規表現</label>
						<input type="text" id="lipsync-regex">
					</div>
					<p class="silence-note">音声ファイル名 (拡張子なし) のキャプチャグループ () の部分を話者名として取り出します。字幕はこの名前で始まるテキストレイヤーに、口パクはこの話者名のキャラクターに反映します。</p>

					<div class="lipsync-group-label">口パク</div>
					<div class="lipsync-field-row">
						<div class="lipsync-field">
							<label for="lipsync-lead">先行フレーム数</label>
							<input type="number" id="lipsync-lead" min="0" max="10">
						</div>
						<div class="lipsync-field">
							<label for="lipsync-min">最短表示フレーム数</label>
							<input type="number" id="lipsync-min" min="1" max="10">
						</div>
					</div>

					<div class="lipsync-group-label">キャラクター</div>
					<div id="lipsync-config-list"></div>
					<div class="lipsync-add-row">
						<select id="lipsync-candidate"></select>
						<button id="btn-lipsync-add">追加</button>
					</div>
				</div>
				<div id="settings-pane-silence" class="settings-pane">
					<div class="lipsync-group-label">判定</div>
					<div class="lipsync-field-row">
						<div class="lipsync-field">
							<label for="silence-threshold">無音とみなす音量 (dB)</label>
							<input type="number" id="silence-threshold" min="-90" max="0" step="1">
						</div>
						<div class="lipsync-field">
							<label for="silence-padding">前後に残す余白 (ms)</label>
							<input type="number" id="silence-padding" min="0" max="2000" step="10">
						</div>
					</div>

					<div class="lipsync-group-label">途中の無音</div>
					<label class="silence-check"><input type="checkbox" id="silence-split">途中の無音でレイヤーを分割する</label>
					<div class="lipsync-field">
						<label for="silence-min-gap">分割する無音の最短の長さ (ms)</label>
						<input type="number" id="silence-min-gap" min="50" max="10000" step="50">
					</div>

					<div class="lipsync-group-label">配置</div>
					<label class="silence-check"><input type="checkbox" id="silence-ripple">カットした隙間を詰める (選択した音声レイヤーのみ移動)</label>

					<p class="silence-note">元のWAVファイルは変更せず、レイヤーのイン/アウトだけを切り詰めます。口パク・字幕の生成より前に実行してください。</p>
				</div>
				<div id="settings-pane-view" class="settings-pane">
					<label class="silence-check"><input type="checkbox" id="chk-thumbnails">レイヤーのサムネイルを表示</label>
				</div>
			</div>
		</div>
	</div>

	<div id="thumb-preview"><canvas></canvas></div>

	<script src="js/CSInterface.js"></script>
	<script src="js/psdthumb.js"></script>
	<script src="js/main.js"></script>
</body>

</html>
